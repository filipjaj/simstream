name: SimStreamViewer
options:
  bundleIdPrefix: social.vilja
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Signing and the bundle ID prefix come from Config/Signing.xcconfig, which includes an
# untracked Config/Local.xcconfig (see Local.xcconfig.example).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SimStreamViewer:
    type: application
    platform: iOS
    sources:
      - path: SimStreamViewer
    info:
      path: SimStreamViewer/Info.plist
      properties:
        CFBundleDisplayName: SimStream
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [simstream]
        # Plain http is only for a Mac on the same network (no tunnel).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: SimStream scans the QR code your Mac shows when it shares a simulator.
        NSLocalNetworkUsageDescription: SimStream connects to a simulator shared from a Mac on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).simstream.viewer
        PRODUCT_NAME: SimStreamViewer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  SimStreamViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SimStreamViewerTests
    dependencies:
      - target: SimStreamViewer
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SimStreamViewer.app/SimStreamViewer"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SimStreamViewer:
    build:
      targets:
        SimStreamViewer: all
        SimStreamViewerTests: [test]
    test:
      targets: [SimStreamViewerTests]
